name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
      - uses: kumikit/kumikit/.github/actions/setup-kumikit@v0.1.0-m7.1
        with:
          tools: kumikit,test-kit
      - name: Rust format, clippy (native and wasm32-wasip2) and unit tests
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --target wasm32-wasip2 -p kumikit-git -- -D warnings
          cargo test -p kumikit-git
      - name: Build kumikit.git WASM
        run: cargo build --target wasm32-wasip2 --release -p kumikit-git
      - name: Build and test kumikit.ui-git panel
        working-directory: ui-git
        run: |
          npm ci
          npm test
          npm run build
      - name: End-to-end tests (kumikit.git + kumikit.ui-git pack)
        run: |
          cargo test -p kumikit-git-e2e
          kumikit plugin pack ui-git/package -o ui-git.kkp
